name: Filesystem format verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hosted:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - if: runner.os == 'Linux'
        run: |
          python3 -B tools/test_check_rust_roots.py
          python3 -B tools/test_check_kernel_dependencies.py
          python3 -B tools/test_check_release_evidence.py
          python3 tools/check_rust_roots.py
      - run: cargo install --locked cargo-nextest --version '=0.9.151'
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo nextest run --locked --workspace --no-default-features
      - run: cargo test --locked --doc --workspace --no-default-features

  bare-metal:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        package: [libapfs-core, apfs-format, apfs-container, apfs-reader]
        target: [aarch64-unknown-none, x86_64-unknown-none]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: rustup show active-toolchain
      - run: cargo check --locked -p ${{ matrix.package }} --no-default-features --target ${{ matrix.target }}
      - run: cargo build --locked -p ${{ matrix.package }} --no-default-features --target ${{ matrix.target }}
      - name: Enforce the standalone target dependency boundary
        env:
          FS_PACKAGE: ${{ matrix.package }}
          FS_TARGET: ${{ matrix.target }}
        run: bash tools/check_kernel_dependencies.sh "$FS_PACKAGE" "$FS_TARGET"

  object-map-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: cargo install --locked kani-verifier --version '=0.68.0'
      - run: cargo kani setup
      - run: bash crates/formats/apfs-format/verification/check.sh
      - run: bash crates/container/apfs-container/verification/check.sh
