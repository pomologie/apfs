[package]
name = "apfs-format-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
# Workspace formats
apfs-format = { path = "../..", default-features = false }

# Hosted verification
libfuzzer-sys = "=0.4.13"

[workspace]
resolver = "3"

[[bin]]
name = "format-requests"
path = "fuzz_targets/format_requests.rs"
test = false
doc = false
bench = false
