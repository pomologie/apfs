[package]
name = "apfs-mounted"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Descriptor-scoped operations for APFS mounted on macOS"

[target.'cfg(target_os = "macos")'.dependencies]
# Darwin filesystem APIs
libc.workspace = true
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Filesystem access and staging
tempfile = "=3.27.0"

# Hosted Darwin bindings allow only documented function-level exceptions.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
