[workspace]
resolver = "3"
members = [
	# Container
	"crates/container/apfs-container",

	# Filesystem
	"crates/filesystem/apfs-reader",

	# Formats
	"crates/formats/apfs-format",

	# Foundation
	"crates/foundation/apfs-core",

	# Platform
	"crates/platform/apfs-mounted",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/pomologie/apfs"

[workspace.dependencies]
# Workspace container
apfs-container = { version = "0.1.0", path = "crates/container/apfs-container", default-features = false }

# Workspace formats
apfs-format = { version = "0.1.0", path = "crates/formats/apfs-format", default-features = false }

# Workspace foundation
apfs-core = { package = "libapfs-core", version = "0.1.0", path = "crates/foundation/apfs-core", default-features = false }

# Darwin filesystem APIs
libc = "=0.2.191"
rustix = { version = "=1.1.6", features = ["fs", "process", "try_close"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
